# Runs the whole test suite (tests/run-all.js) on every push and pull request.
# The tests are plain Node + Playwright scripts; Playwright is not committed (package.json is
# gitignored), so it is installed here without saving, and the scripts are pointed at the Chromium
# it downloads through SM_CHROME. The version is pinned (the one the suite is run with locally), so a
# new Playwright/Chromium release cannot change the results of an unchanged commit.
name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (pinned; not saved to package.json)
        run: npm i --no-save playwright@1.63.0

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run every test script
        run: |
          export SM_CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Chromium: $SM_CHROME"
          node tests/run-all.js
